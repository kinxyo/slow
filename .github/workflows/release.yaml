name: release

# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) tests the
# code, builds the binaries and publishes them as a GitHub Release named after
# the tag. Branch pushes never publish anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=''; [ "$os" = windows ] && ext='.exe'
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.CommitSHA=${GITHUB_SHA}" -o "dist/slo-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --generate-notes
