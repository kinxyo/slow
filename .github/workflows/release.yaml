name: release

# Every push to main tests the code, builds the binaries and publishes them as a
# GitHub Release tagged v0.1.<run number>. Other branches never trigger this.
# It can also be started by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'plan/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=''; [ "$os" = windows ] && ext='.exe'
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.Version=0.1.${{ github.run_number }} -X main.CommitSHA=${GITHUB_SHA}" -o "dist/slo-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v0.1.${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --generate-notes
