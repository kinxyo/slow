name: ci

# Tests and builds every branch and pull request. main is also handled by
# release.yaml, which tests again before it publishes.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
